[project]
name = "qb"
version = "0.1.0"
description = "HoReCa purchasing marketplace for Armenia: multi-seller cart, price negotiation, documents"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "redis>=5.0",
    "rq>=1.16",
    "httpx>=0.27",
    "aiogram>=3.13,<4",
    "apscheduler>=3.10,<4",
    "uuid6>=2024.7.10",
    "tzdata>=2024.1",  # Asia/Yerevan in slim images
    "python-multipart>=0.0.9",  # file uploads (verification documents)
    "google-auth>=2.34",  # Sign in with Google: ID token verification
    "requests>=2.32",  # transport for google-auth
    "openpyxl>=3.1",  # price lists from Excel (.xlsx)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]  # generated by autogenerate

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal expectations read better on one line
