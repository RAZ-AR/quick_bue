server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;  # product and claim photos

  # API: same origin as the PWA, /api prefix stripped (the backend has none)
  # Docker's DNS, re-resolved every 10s: a recreated api container gets a new IP, and a static
  # proxy_pass would keep sending traffic to the old one (502 after every redeploy)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The service worker and manifest must never be cached, or updates get stuck
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # SPA routes
  location / { try_files $uri /index.html; }
}
